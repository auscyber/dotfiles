[package]
name = "autopen-codesign"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
apple-codesign = { version = "0.29", default-features = false }
bytes = "1.8"
clap = { version = "4", features = ["derive", "env"] }
signature = { version = "2.2", features = ["std"] }
tempfile = "3"
thiserror = "2"
x509-certificate = "0.24"
zeroize = "1.8"
