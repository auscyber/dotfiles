name: "Provision the macOS codesign signer"
description: "Start a throwaway autopen server where aspects/darwin/codesign.nix signs through, so signed packages can build on a runner."

# Signed wrappers (aspects/darwin/codesign.nix) sign through the autopen socket
# and cannot be substituted, so a darwin host that includes `den.aspects.codesign`
# cannot build without one. This serves a THROWAWAY key on the fixed socket.
# It does not match the committed certificate: CI proves these build, and a
# CI-signed output never reaches a machine. The real key never leaves its host.
#
# A no-op off macOS, and never fatal: if the server cannot start, the signed
# packages fail on their own, which the caller's `allow-failure` accounts for.

runs:
  using: "composite"
  steps:
    - name: Start autopen
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        if ! nix run .#autopen-ci-serve; then
          echo "::warning::autopen could not be started - packages built by aspects/darwin/codesign.nix will fail" >&2
        fi
