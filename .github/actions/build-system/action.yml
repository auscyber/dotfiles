name: "Build one system"
description: "Set up Nix, warm the caches, and build one flake attribute family for one system with nix-fast-build."

# The whole body of a per-system build workflow lives here, so the three
# .github/workflows/build-<system>.yml files stay a name, a runner label and a
# call. They differ only in `runs-on`; everything below is either identical or
# already conditional on `runner.os`.
#
# .github/workflows/checks.yml reuses the same steps with `attr: checks`, so the
# flake's checks get the identical cache, codesign and push setup as the host
# builds without a second copy of any of it.
#
# A composite action cannot set `runs-on`, and `secrets` is not in scope inside
# one -- hence the tokens as inputs.

inputs:
  system:
    description: "Nix system to build, e.g. x86_64-linux."
    required: true
  attr:
    description: >-
      Flake attribute family to build, evaluated as `.#<attr>.<system>`.
      `ciMatrix.checks` (the default) is every host for that system;
      `checks` is the flake's own checks.
    required: false
    default: "ciMatrix.checks"
  celler-token:
    description: "CELLER_TOKEN. Empty disables both the cache push and the celler gate (fork PRs have no secrets)."
    required: false
    default: ""
  github-token:
    description: "GITHUB_TOKEN, used for `access-tokens` so flake input fetches are not rate-limited."
    required: false
    default: ""
  eval-workers:
    description: "Cap on nix-eval-jobs workers. Empty leaves nix-fast-build's default."
    required: false
    default: ""
  codesign-identity:
    description: >-
      macOS only. A concatenated key+certificate PEM to plant at the codesign
      identity path. Empty (the default) mints a throwaway one instead -- see
      `codesign-ci-identity` in aspects/darwin/codesign.nix for why that is the
      right default.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Must come before the installer: it builds the volume Nix is installed
    # onto. Ubuntu-only, so it is skipped rather than left to warn on macOS.
    - if: ${{ runner.os == 'Linux' }}
      uses: wimpysworld/nothing-but-nix@main
      with:
        hatchet-protocol: cleave

    # `accept-flake-config` pulls substituters + trusted-public-keys from the
    # flake's own nixConfig (derived from aspects/base/celler-keys.json). The
    # celler entries are repeated here because they have to be trusted *before*
    # the flake is ever evaluated, i.e. while installing celler itself.
    #
    # `extra-trusted-users = runner`: the daemon honours `__noChroot` only for a
    # trusted user, and every codesign-signed package sets it
    # (aspects/darwin/codesign.nix) because it has to read the identity off the
    # real filesystem. Without this the darwin leg fails on the first signed
    # package with the identity "unreadable", however correctly it was planted.
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          experimental-features = nix-command flakes pipe-operators
          accept-flake-config = true
          fallback = true
          connect-timeout = 5
          extra-trusted-users = runner
          access-tokens = github.com=${{ inputs.github-token }}
          extra-substituters = https://cache.ivymect.in/main
          extra-trusted-substituters = https://cache.ivymect.in/main
          extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=

    # Make sure the celler client itself is in the cache for this arch before
    # anything tries to install it (builds + dogfood-pushes it only on a miss).
    - if: ${{ inputs.celler-token != '' }}
      uses: ./.github/actions/ensure-celler
      with:
        celler-token: ${{ inputs.celler-token }}

    # Installs the celler client, points nix at the cache, and registers the
    # post-job push. `flake-ref: ".#celler"` -- not `inputs-from: "."` -- so this
    # installs the exact installable ensure-celler just verified is cached;
    # resolving through the registry instead produced a different derivation and
    # rebuilt celler (aws-sdk-s3 and all) on every run.
    - name: Setup celler cache
      if: ${{ inputs.celler-token != '' }}
      uses: auscyber/celler-action@main
      with:
        endpoint: https://cache.ivymect.in
        cache: main
        token: ${{ inputs.celler-token }}
        flake-ref: ".#celler"

    # Every signed package aborts its build if the codesign identity is missing
    # (aspects/darwin/codesign.nix), and every darwin host in
    # `.#ciMatrix.checks.aarch64-darwin` pulls in `den.aspects.codesign` -- so
    # without this the darwin leg cannot build at all.
    - name: Provision macOS codesign identity
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      env:
        CODESIGN_IDENTITY: ${{ inputs.codesign-identity }}
      run: |
        set -euo pipefail
        identity=/run/agenix/secrets/codesign/identity

        # macOS seals `/`, so a new top-level directory needs a synthetic
        # firmlink -- the same mechanism the Nix installer uses for /nix.
        # nix-darwin does this for /run on a real host; a runner has never
        # seen it.
        if [ ! -d /run ]; then
          printf 'run\tprivate/var/run\n' | sudo tee -a /etc/synthetic.conf >/dev/null
          apfs_util=/System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util
          sudo "$apfs_util" -t >/dev/null 2>&1 || sudo "$apfs_util" -B >/dev/null 2>&1 || true
        fi
        if [ ! -d /run ]; then
          echo "::error::/run could not be created on this runner; the codesign identity has nowhere to go" >&2
          exit 1
        fi
        sudo install -d -m 0755 "$(dirname "$identity")"

        if [ -n "$CODESIGN_IDENTITY" ]; then
          printf '%s' "$CODESIGN_IDENTITY" | sudo tee "$identity" >/dev/null
          # A real key gets the same 0640 root:nixbld the host uses, so only
          # build users can read it.
          sudo chown root:nixbld "$identity"
          sudo chmod 0640 "$identity"
        else
          nix run .#codesign-ci-identity | sudo tee "$identity" >/dev/null
          # Throwaway, and discarded with the runner -- world-readable rather
          # than depending on what the installer named the build-user group.
          sudo chmod 0644 "$identity"
        fi

    # Every patched-input tree is a fixed-output derivation once its hash is
    # recorded (lib/patched-inputs.nix), so the output path is identical on
    # every system. Building `.#patched-inputs-warm` natively here -- with this
    # runner's own pkgs, never a foreign builder -- means the host builds below
    # always find `newInputs`' single-`patchSystem` realisation already in the
    # store. See aspects/tooling/patch-inputs.nix.
    - name: Warm patched-input FODs
      shell: bash
      run: nix build --no-link --fallback .#patched-inputs-warm

    # `.#nix-fast-build` rather than plain `nixpkgs#nix-fast-build`: ours carries
    # patches/nix-fast-build/celler.patch, which adds `--celler-cache`. Uploads
    # then happen as each host finishes instead of all at once in celler-action's
    # post step -- which matters now that one job builds a whole arch and so runs
    # long enough to be worth publishing progressively. celler-action's post push
    # still runs, and is what covers everything nix-fast-build did not build
    # (the warm FODs, nix-fast-build itself).
    #
    # Which hosts failed is not lost by collapsing them into one job:
    # nix-fast-build writes a GitHub job summary naming every failure (with its
    # build log) and folds the successful logs into ::group:: sections.
    - name: Build ${{ inputs.attr }}.${{ inputs.system }}
      shell: bash
      env:
        SYSTEM: ${{ inputs.system }}
        ATTR: ${{ inputs.attr }}
        CELLER_CACHE: ${{ inputs.celler-token != '' && 'main' || '' }}
        EVAL_WORKERS: ${{ inputs.eval-workers }}
      run: |
        set -euo pipefail
        # `if`, not `[ x ] && ...`: under `set -e` a failing `&&` list is itself
        # a failing command, so the plain guard would abort the step whenever
        # the variable happened to be empty.
        args=(--flake ".#$ATTR.$SYSTEM" --skip-cached)
        if [ -n "$CELLER_CACHE" ]; then
          args+=(--celler-cache "$CELLER_CACHE")
        fi
        if [ -n "$EVAL_WORKERS" ]; then
          args+=(--eval-workers "$EVAL_WORKERS")
        fi
        nix run .#nix-fast-build -- "${args[@]}"
