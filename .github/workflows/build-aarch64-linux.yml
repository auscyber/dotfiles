name: "aarch64-linux"
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# The aarch64-linux leg. See build-x86_64-linux.yml for the rationale and
# ./.github/actions/build-system for every step.

jobs:
  build:
    name: aarch64-linux
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/build-system
        with:
          system: aarch64-linux
          celler-token: ${{ secrets.CELLER_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
