name: "aarch64-darwin"
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# The aarch64-darwin leg. See build-x86_64-linux.yml for the rationale and
# ./.github/actions/build-system for every step.

jobs:
  build:
    name: aarch64-darwin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/build-system
        with:
          system: aarch64-darwin
          celler-token: ${{ secrets.CELLER_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # macos-14 is the smallest of the three runners, and each nix-eval-jobs
          # worker may take up to --eval-max-memory-size (4GB by default) while
          # evaluating a darwin/home toplevel. Cap the workers so parallel
          # evaluation is not OOM-killed there.
          eval-workers: 2
          # darwin-laptop is the only host that includes `den.aspects.codesign`
          # (aspects/hosts/laptop.nix), so it is the only one that cannot be
          # built without a signing identity: `sign` aborts in postFixup when
          # the identity is unreadable, and sets `allowSubstitutes = false`, so
          # there is no cache to fall back on. ./.github/actions/codesign-identity
          # mints a throwaway one and usually makes this moot -- this is the
          # backstop for when it cannot, so the rest of aarch64-darwin is still
          # built and still reported instead of the run dying on one host.
          #
          # Drop this the moment codesign.nix signs via a separate wrapper
          # derivation: then sketchybar/paneru/kanata build (and substitute)
          # untouched, and only the wrapper needs the key.
          allow-failure: darwin-laptop
