name: "push patched forks"
# Republish each patched flake input as a GitHub fork under this account:
# upstream-as-locked + patches/<input>/*.patch, force-pushed to
# github:<owner>/<repo>/<branch>. Downstream flakes then consume the patched
# version directly, without carrying any of the in-repo patch machinery.
#
# Runs after the `update` bot bumps flake.lock (via the push paths filter) and
# on demand. See scripts/push-patched-forks.sh and lib/patched-forks-manifest.nix.
#
# Auth: reuses the same GitHub App as update.yml (secrets.APP_ID /
# APP_PRIVATE_KEY), tokened owner-wide so it can write to the forks. The app
# must be installed on this account with `contents: write` (plus
# `administration: write` so the script can auto-create missing forks — see
# ensure_fork in scripts/push-patched-forks.sh). If you'd rather manage forks
# by hand, pre-create them and set AUTO_FORK=0 in the "Push patched forks" step.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to push to each fork"
        required: false
        default: "dendritic-patched"
  push:
    branches:
      - main
      - master
    paths:
      - "patches/**"
      - "patched-inputs.nix"
      - "flake.lock"
      - "lib/patched-forks-manifest.nix"
      - "scripts/push-patched-forks.sh"
      - ".github/workflows/push-patched-forks.yml"

concurrency:
  group: push-patched-forks
  cancel-in-progress: true

jobs:
  push-forks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token (owner-wide)
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Token scoped to every repo the app can access under this account,
          # not just the current one — we push to the fork repos.
          owner: ${{ github.repository_owner }}

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Compute manifest
        run: |
          branch="${{ github.event.inputs.branch || 'dendritic-patched' }}"
          nix eval --impure --json \
            --expr "import ./lib/patched-forks-manifest.nix { owner = \"${{ github.repository_owner }}\"; branch = \"$branch\"; root = ./.; }" \
            > manifest.json
          echo "── manifest ──"
          jq . manifest.json

      - name: Push patched forks
        run: ./scripts/push-patched-forks.sh --manifest manifest.json
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Attribute the patch commits to the App's bot identity (resolved
          # from the token by the script).
          GH_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
