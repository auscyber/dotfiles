name: "Build all systems"
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# One job per system type (x86_64-linux, aarch64-linux, aarch64-darwin), not
# one job per host: each build-<arch> job below points `nix-fast-build` (see
# aspects/tooling/ci.nix) at `.#ciMatrix.checks.<arch>` -- the full set of
# host toplevels for that arch, computed by aspects/tooling/ci-matrix.nix --
# and builds every host of that arch in one nix-eval-jobs-driven pass.
# Deliberately scoped to `.checks.<arch>` (not `.checks` + a `--systems`
# filter): nix-fast-build force-recurses the whole attrset it's pointed at
# before filtering by system, so pointing it at the single matching arch
# (and letting `--systems` default to the runner's own native system) skips
# evaluating the other two arches' host configs entirely on every job,
# instead of evaluating all three redundantly on all three runners. That
# replaces what used to be a GitHub Actions matrix job PER HOST (one
# checkout/install-nix/cache-restore per host, all duplicated N times per
# arch); now it happens exactly once per arch, and nix-fast-build's own
# parallel evaluation+build keeps hosts of the same arch building
# concurrently inside that one job. fail-fast is nix-fast-build's own
# behaviour (it builds/reports every job, doesn't stop at the first
# failure) -- one host failing to build never stops its arch-mates.
#
# Each build-<arch> job also wires up a real Nix `post-build-hook`
# (.github/actions/celler-build-hook, mirroring the same mechanism
# aspects/base/caches.nix uses on real hosts) so every derivation it builds
# is pushed to celler the moment it finishes, rather than in a single bulk
# push at job end -- with N hosts now sharing one job, a bulk end-of-job
# push would mean a fast host's result sits unpushed until the slowest host
# in its arch finishes (or is lost entirely if the job times out).
#
# All jobs `accept-flake-config`, so substituters + trusted-public-keys come
# from the flake's nixConfig (built from aspects/base/celler-keys.json) --
# nothing hardcoded here, except in the jobs that need celler's cache to
# actually be trusted before celler itself is installed (see
# extra-trusted-substituters below).
#
# `celler-<system>` makes sure the `celler` client itself (`.#celler`,
# exposed by aspects/tooling/ci.nix) is present in the cache for that one
# arch, via ./.github/actions/ensure-celler (builds and dogfood-pushes it
# only if it's actually missing -- a hit is one cheap query). One gate job
# per arch (rather than per host) means it happens exactly once per arch,
# and the build-<arch> jobs (plus their post-build-hook, which also shells
# out to `.#celler`) depend on it so `.#celler` is always a cache hit by the
# time they need it.
#
# `warm-patched-inputs` builds and pushes every patched-input FOD
# (packages.patched-inputs-warm, aspects/tooling/patch-inputs.nix) once,
# natively on x86_64-linux. Those trees are fixed-output derivations once
# their hash is recorded, so the output path is identical on every system --
# substitution never cares which arch built it. Every build-<system> job
# below requires this one, so none of them ever have to realise a
# patched-input FOD themselves: no cache-miss race, no falling back to a
# foreign x86_64-linux builder on aarch64-linux/aarch64-darwin (which is what
# `--impure` used to paper over).
jobs:
  celler-x86_64-linux:
    name: celler (x86_64-linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            fallback = true
            connect-timeout = 5
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=
      - uses: ./.github/actions/nix-cache
      - if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/ensure-celler
        with:
          celler-token: ${{ secrets.CELLER_TOKEN }}

  # Every patched-input tree is a fixed-output derivation once its hash is
  # recorded (lib/patched-inputs.nix), so its output path is identical
  # regardless of which system builds it -- substitution never cares about
  # arch. Building it once here, natively on x86_64-linux, and requiring this
  # job for the non-x86_64-linux builds below means those never need to
  # realise it themselves: no cache-miss race, no falling back to a foreign
  # x86_64-linux builder, no `--impure` to paper over that. See
  # packages.patched-inputs-warm in aspects/tooling/patch-inputs.nix.
  warm-patched-inputs:
    name: warm patched-input FODs
    needs: celler-x86_64-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            fallback = true
            connect-timeout = 5
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=
      - uses: ./.github/actions/nix-cache
      - if: ${{ github.event_name != 'pull_request' }}
        uses: auscyber/celler-action@main
        with:
          endpoint: https://cache.ivymect.in
          cache: main
          flake-ref: ".#celler"
          token: ${{ secrets.CELLER_TOKEN }}
      - name: "warm patched inputs"
        run: |
          set -euo pipefail
          nix build --no-link .#patched-inputs-warm

  celler-aarch64-linux:
    name: celler (aarch64-linux)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            fallback = true
            connect-timeout = 5
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=
      - uses: ./.github/actions/nix-cache
      - if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/ensure-celler
        with:
          celler-token: ${{ secrets.CELLER_TOKEN }}

  celler-aarch64-darwin:
    name: celler (aarch64-darwin)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            fallback = true
            connect-timeout = 5
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=
      - uses: ./.github/actions/nix-cache
      - if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/ensure-celler
        with:
          celler-token: ${{ secrets.CELLER_TOKEN }}

  build-x86_64-linux:
    name: build (x86_64-linux)
    needs: [celler-x86_64-linux, warm-patched-inputs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Must run BEFORE install-nix-action: it writes the post-build-hook
      # script that install-nix-action's nix.conf points at below.
      - uses: ./.github/actions/celler-build-hook
        id: build-hook
        with:
          celler-token: ${{ github.event_name != 'pull_request' && secrets.CELLER_TOKEN || '' }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            fallback = true
            connect-timeout = 5
            post-build-hook = ${{ steps.build-hook.outputs.hook-path }}
      - uses: ./.github/actions/nix-cache
      - name: Build every x86_64-linux host
        run: |
          set -euo pipefail
          nix run .#nix-fast-build -- \
            --flake ".#ciMatrix.checks.x86_64-linux" \
            --skip-cached \
            --no-link

  build-aarch64-linux:
    name: build (aarch64-linux)
    needs: [celler-aarch64-linux, warm-patched-inputs]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/celler-build-hook
        id: build-hook
        with:
          celler-token: ${{ github.event_name != 'pull_request' && secrets.CELLER_TOKEN || '' }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            fallback = true
            connect-timeout = 5
            post-build-hook = ${{ steps.build-hook.outputs.hook-path }}
      - uses: ./.github/actions/nix-cache
      - name: Build every aarch64-linux host
        run: |
          set -euo pipefail
          nix run .#nix-fast-build -- \
            --flake ".#ciMatrix.checks.aarch64-linux" \
            --skip-cached \
            --no-link

  build-darwin:
    name: build (aarch64-darwin)
    needs: [celler-aarch64-darwin, warm-patched-inputs]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/celler-build-hook
        id: build-hook
        with:
          celler-token: ${{ github.event_name != 'pull_request' && secrets.CELLER_TOKEN || '' }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            fallback = true
            connect-timeout = 5
            post-build-hook = ${{ steps.build-hook.outputs.hook-path }}
      - uses: ./.github/actions/nix-cache
      - name: Build every aarch64-darwin host
        run: |
          set -euo pipefail
          nix run .#nix-fast-build -- \
            --flake ".#ciMatrix.checks.aarch64-darwin" \
            --skip-cached \
            --no-link

  # One job per arch now (rather than one leg per host), so a build-<arch>
  # job going red already makes the run red -- this just aggregates the gate
  # jobs alongside the three build jobs into a single friendly check, and
  # still runs unconditionally (if: always()) so it reports even when one of
  # its needs failed or was skipped.
  ci:
    name: CI
    if: always()
    needs:
      - celler-x86_64-linux
      - celler-aarch64-linux
      - celler-aarch64-darwin
      - warm-patched-inputs
      - build-x86_64-linux
      - build-aarch64-linux
      - build-darwin
    runs-on: ubuntu-latest
    steps:
      - name: Check whether any job failed
        run: |
          set -euo pipefail
          results='${{ toJSON(needs) }}'
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | map(.key) | join(", ")' <<<"$results")"
          if [ -n "$failed" ]; then
            echo "::error::Failed (or cancelled): $failed" >&2
            exit 1
          fi
          echo "All jobs passed."
