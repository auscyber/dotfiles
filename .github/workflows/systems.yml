name: "Build all systems"
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Dynamic matrix: the `matrix` job evaluates `.#ciMatrix.matrix` (nix-github-
# actions, from aspects/tooling/ci.nix) at run time and splits it three ways,
# one bucket per arch (`matrix-x86_64-linux`, `matrix-aarch64-linux`,
# `matrix-darwin`), so each of the three host-build calls below can depend on
# exactly its own celler gate job and nothing else. fail-fast: false -> one
# machine failing never stops the others. All jobs `accept-flake-config`, so
# substituters + trusted-public-keys come from the flake's nixConfig (built
# from aspects/base/celler-keys.json) -- nothing hardcoded here, except in the
# jobs that need celler's cache to actually be trusted before celler itself is
# installed (see extra-trusted-substituters below).
#
# `celler-<system>` makes sure the `celler` client itself (`.#celler`, exposed
# by aspects/tooling/ci.nix) is present in the cache for that one arch, via
# ./.github/actions/ensure-celler (builds and dogfood-pushes it only if it's
# actually missing -- a hit is one cheap query). One gate job per arch (rather
# than per host) means it happens exactly once per arch instead of racing N
# copies of itself across every host that shares that arch.
#
# `warm-patched-inputs` builds and pushes every patched-input FOD
# (packages.patched-inputs-warm, aspects/tooling/patch-inputs.nix) once,
# natively on x86_64-linux. Those trees are fixed-output derivations once
# their hash is recorded, so the output path is identical on every system --
# substitution never cares which arch built it. build-aarch64-linux and
# build-darwin both require this job, so they always hit a warm cache for the
# patched inputs instead of racing a build of their own on a foreign
# x86_64-linux builder (which is what `--impure` used to paper over).
#
# `build-<system>` each call the reusable ./.github/workflows/build-host.yml
# once per host (via `strategy.matrix`, which reusable-workflow calls
# support), so the actual build/push steps are defined in one place.
# build-x86_64-linux needs only its own matching celler-x86_64-linux gate;
# build-aarch64-linux and build-darwin additionally need warm-patched-inputs
# (and, transitively through it, celler-x86_64-linux) -- the one deliberate
# cross-arch wait, needed so those two never have to build the patched
# inputs themselves.
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix-x86_64-linux: ${{ steps.set.outputs.matrix-x86_64-linux }}
      matrix-aarch64-linux: ${{ steps.set.outputs.matrix-aarch64-linux }}
      matrix-darwin: ${{ steps.set.outputs.matrix-darwin }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            fallback = true
            connect-timeout = 5
      - uses: ./.github/actions/nix-cache
      - id: set
        run: |
          set -euo pipefail
          matrix="$(nix eval --json .#ciMatrix.matrix)"
          if [ -z "$matrix" ] || [ "$matrix" = "null" ]; then
            echo "::error::.#ciMatrix.matrix produced nothing — flake eval failed above" >&2
            exit 1
          fi
          # .os can be either a plain runner-label string or a list of labels
          # (nix-github-actions emits either), so normalize to a list before
          # matching -- a bare string == comparison would silently miss every
          # row if .os happens to come back as a list. Match with `index`
          # (exact element equality), NOT `contains`: jq's `contains` is a deep
          # SUBSTRING test, so `["ubuntu-24.04-arm"] | contains(["ubuntu-24.04"])`
          # is true and an aarch64 row would leak into the x86_64 bucket (built
          # on the wrong-arch runner).
          filter='def osIs(x): ((.os | if type == "array" then . else [.] end) | index(x)) != null; {include: [.include[] | select(osIs($os))]}'
          x8664="$(jq -c --arg os ubuntu-24.04 "$filter" <<<"$matrix")"
          aarch64linux="$(jq -c --arg os ubuntu-24.04-arm "$filter" <<<"$matrix")"
          darwin="$(jq -c --arg os macos-14 "$filter" <<<"$matrix")"
          echo "matrix-x86_64-linux=$x8664" >> "$GITHUB_OUTPUT"
          echo "matrix-aarch64-linux=$aarch64linux" >> "$GITHUB_OUTPUT"
          echo "matrix-darwin=$darwin" >> "$GITHUB_OUTPUT"

  celler-x86_64-linux:
    name: celler (x86_64-linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            fallback = true
            connect-timeout = 5
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=
      - uses: ./.github/actions/nix-cache
      - if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/ensure-celler
        with:
          celler-token: ${{ secrets.CELLER_TOKEN }}

  # Every patched-input tree is a fixed-output derivation once its hash is
  # recorded (lib/patched-inputs.nix), so its output path is identical
  # regardless of which system builds it -- substitution never cares about
  # arch. Building it once here, natively on x86_64-linux, and requiring this
  # job for the non-x86_64-linux builds below means those never need to
  # realise it themselves: no cache-miss race, no falling back to a foreign
  # x86_64-linux builder, no `--impure` to paper over that. See
  # packages.patched-inputs-warm in aspects/tooling/patch-inputs.nix.
  warm-patched-inputs:
    name: warm patched-input FODs
    needs: celler-x86_64-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            fallback = true
            connect-timeout = 5
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=
      - uses: ./.github/actions/nix-cache
      - if: ${{ github.event_name != 'pull_request' }}
        uses: auscyber/celler-action@main
        with:
          endpoint: https://cache.ivymect.in
          cache: main
          token: ${{ secrets.CELLER_TOKEN }}
          flake-ref: ".#packages.x86_64-linux.patched-inputs-warm"

  celler-aarch64-linux:
    name: celler (aarch64-linux)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            fallback = true
            connect-timeout = 5
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=
      - uses: ./.github/actions/nix-cache
      - if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/ensure-celler
        with:
          celler-token: ${{ secrets.CELLER_TOKEN }}

  celler-aarch64-darwin:
    name: celler (aarch64-darwin)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            fallback = true
            connect-timeout = 5
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=
      - uses: ./.github/actions/nix-cache
      - if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/ensure-celler
        with:
          celler-token: ${{ secrets.CELLER_TOKEN }}

  build-x86_64-linux:
    needs: [matrix, celler-x86_64-linux]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix-x86_64-linux) }}
    uses: ./.github/workflows/build-host.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ toJSON(matrix.os) }}
      attr: ${{ matrix.attr }}
    secrets: inherit

  build-aarch64-linux:
    needs: [matrix, celler-aarch64-linux, warm-patched-inputs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix-aarch64-linux) }}
    uses: ./.github/workflows/build-host.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ toJSON(matrix.os) }}
      attr: ${{ matrix.attr }}
    secrets: inherit

  build-darwin:
    needs: [matrix, celler-aarch64-darwin, warm-patched-inputs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix-darwin) }}
    uses: ./.github/workflows/build-host.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ toJSON(matrix.os) }}
      attr: ${{ matrix.attr }}
    secrets: inherit

  # GitHub reports one check per matrix leg (e.g. "build-x86_64-linux
  # (nixos-auspc)"), not one for the build-<arch> job as a whole, so nothing
  # otherwise turns the overall run red when a single host fails to build.
  # This job runs unconditionally (if: always(), so it still runs even though
  # some of its needs may have failed) after everything else finishes and
  # fails loudly if anything it depends on did -- fail-fast: false above
  # already keeps a failing host from cancelling its siblings, this job just
  # makes that failure visible instead of leaving it buried in one leg.
  ci:
    name: CI
    if: always()
    needs:
      - matrix
      - celler-x86_64-linux
      - celler-aarch64-linux
      - celler-aarch64-darwin
      - warm-patched-inputs
      - build-x86_64-linux
      - build-aarch64-linux
      - build-darwin
    runs-on: ubuntu-latest
    steps:
      - name: Check whether any job failed
        run: |
          set -euo pipefail
          results='${{ toJSON(needs) }}'
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | map(.key) | join(", ")' <<<"$results")"
          if [ -n "$failed" ]; then
            echo "::error::Failed (or cancelled): $failed" >&2
            exit 1
          fi
          echo "All jobs passed."
