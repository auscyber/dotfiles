name: "x86_64-linux"
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# One workflow per system type. There is no dynamic GitHub matrix any more:
# nix-fast-build evaluates every host for THIS system in parallel and starts
# each build the moment its evaluation finishes, so the whole arch is one job
# instead of one job per host plus a matrix job to enumerate them.
#
# * `--flake .#ciMatrix.checks.x86_64-linux` is the attrset of buildable
#   toplevels for this arch (`"<class>-<name>"`, see aspects/tooling/ci-matrix.nix).
#   nix-fast-build takes the whole attrset, so nothing here has to know which
#   hosts exist.
# * `--skip-cached` means a host already present in celler is neither built nor
#   downloaded -- an unchanged run costs one query per host.
# * nix-fast-build does not fail fast by default, so one broken host never stops
#   its siblings, and the job still goes red at the end. That is what
#   `fail-fast: false` plus the old aggregate `ci` job used to buy us.
# * Nix setup is wimpysworld/nothing-but-nix (reclaims the runner's disk for
#   /nix, must run BEFORE the installer) + DeterminateSystems/nix-installer-action.
# * `accept-flake-config` pulls substituters + trusted-public-keys from the
#   flake's own nixConfig (derived from aspects/base/celler-keys.json). The
#   celler entries are repeated in `extra-conf` because they have to be trusted
#   *before* the flake is ever evaluated, i.e. while installing celler itself.
jobs:
  build:
    name: x86_64-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Must come before the installer: it builds the volume Nix is installed
      # onto. Ubuntu-only; it warns and skips elsewhere.
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: cleave

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            fallback = true
            connect-timeout = 5
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://cache.ivymect.in/main
            extra-trusted-substituters = https://cache.ivymect.in/main
            extra-trusted-public-keys = main:xS+QBlQtWPB/oX9un7feA68WGJRWfizG4C0YQUsmeN4=

      # Make sure the celler client itself is in the cache for this arch before
      # anything tries to install it (builds + dogfood-pushes it only on a miss).
      # Skipped on pull_request: fork PRs have no CELLER_TOKEN.
      - if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/ensure-celler
        with:
          celler-token: ${{ secrets.CELLER_TOKEN }}

      # Installs the celler client and registers the post-job push, so every
      # path nix-fast-build produces below lands in the cache. `flake-ref:
      # ".#celler"` -- not `inputs-from: "."` -- so this installs the exact
      # installable ensure-celler just verified is cached; resolving through the
      # registry instead produced a different derivation and rebuilt celler
      # (aws-sdk-s3 and all) on every run.
      - name: Setup celler cache
        if: ${{ github.event_name != 'pull_request' }}
        uses: auscyber/celler-action@main
        with:
          endpoint: https://cache.ivymect.in
          cache: main
          token: ${{ secrets.CELLER_TOKEN }}
          flake-ref: ".#celler"

      # Every patched-input tree is a fixed-output derivation once its hash is
      # recorded (lib/patched-inputs.nix), so the output path is identical on
      # every system. Building `.#patched-inputs-warm` natively here -- with
      # this runner's own pkgs, never a foreign builder -- means the host builds
      # below always find `newInputs`' single-`patchSystem` realisation already
      # in the store. See aspects/tooling/patch-inputs.nix.
      - name: Warm patched-input FODs
        run: nix build --no-link --fallback .#patched-inputs-warm

      # `--inputs-from .` resolves `nixpkgs` through this flake's lock, so
      # nix-fast-build comes from the pinned nixpkgs (a cache.nixos.org hit)
      # rather than whatever the runner's registry points at.
      #
      # Which hosts failed is not lost by collapsing them into one job:
      # nix-fast-build writes a GitHub job summary naming every failure (with
      # its build log) and folds the successful logs into ::group:: sections.
      - name: Build all x86_64-linux hosts
        run: |
          set -euo pipefail
          nix run --inputs-from . nixpkgs#nix-fast-build -- \
            --flake ".#ciMatrix.checks.x86_64-linux" \
            --skip-cached
