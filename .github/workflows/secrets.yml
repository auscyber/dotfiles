name: "secrets"
# Generate missing secrets and rekey them to every host, as the CI master
# (aspects/security/agenix-rekey.nix). Dispatched by hand from `master` only:
#
#   * the key is an ENVIRONMENT secret of `secrets`, whose deployment branch
#     rule must be set to `master` in the repo settings -- so a workflow on any
#     other ref, including an edited copy of this file, cannot read it;
#   * the job refuses any other ref and wants the confirmation typed out.
#
# While the master key is mid-recovery (CLAUDE.md, "Secrets") this is the same
# operation as `nix run .#gen-secrets` and must not be dispatched.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type `generate and rekey` to run"
        required: true

concurrency:
  group: secrets
  cancel-in-progress: false

jobs:
  rekey:
    if: github.ref == 'refs/heads/master' && inputs.confirm == 'generate and rekey'
    runs-on: ubuntu-24.04
    environment: secrets
    permissions:
      contents: write
    env:
      AGENIX_REKEY_PRIMARY_IDENTITY_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Install the CI master
        env:
          KEY: ${{ secrets.AGENIX_CI_MASTER }}
        run: |
          install -d -m 700 /tmp/agenix-ci
          printf '%s\n' "$KEY" > /tmp/agenix-ci/master.txt
          chmod 600 /tmp/agenix-ci/master.txt
          echo "AGENIX_REKEY_PRIMARY_IDENTITY=$(cat aspects/security/ci-master.pub)" >> "$GITHUB_ENV"

      - name: Generate missing secrets
        run: nix run .#gen-secrets

      - name: Rekey to every host
        run: nix run .#rekey

      - name: Commit
        run: |
          git config user.name "secrets workflow"
          git config user.email "secrets@users.noreply.github.com"
          git add secrets
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "secrets: generate and rekey (${GITHUB_RUN_ID})"
            git push origin HEAD:master
          fi

      - name: Remove the CI master
        if: always()
        run: shred -u /tmp/agenix-ci/master.txt || rm -f /tmp/agenix-ci/master.txt
